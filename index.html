<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #6b6b6b;
    --gap: 6px;
    --overlay: rgba(10, 10, 10, 0.82);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0d0d; --ink: #f2f2f2; --muted: #9a9a9a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
  }
  header {
    padding: 40px var(--gap) 28px; text-align: center;
  }
  h1 {
    font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400;
    font-size: clamp(40px, 8vw, 104px); line-height: .9; letter-spacing: .02em; margin: 0;
  }
  .sub { color: var(--muted); font-size: 14px; margin-top: 12px; letter-spacing: .04em; }
  .controls { margin-top: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .controls button {
    font: 600 12px Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase;
    background: transparent; color: var(--ink); border: 1px solid var(--ink);
    padding: 7px 14px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .grid {
    display: grid; gap: var(--gap); padding: var(--gap);
    grid-template-columns: repeat(var(--cols, 10), 1fr);
  }
  @media (max-width: 1100px) { .grid { --cols: 8 !important; } }
  @media (max-width: 800px)  { .grid { --cols: 5 !important; } }
  @media (max-width: 480px)  { .grid { --cols: 3 !important; } }

  .tile {
    position: relative; aspect-ratio: 1; overflow: hidden; cursor: zoom-in;
    background: #1a1a1a; border: 0; padding: 0; display: block; width: 100%;
  }
  .tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .35s ease, filter .35s ease;
  }
  .tile.wide img { object-fit: contain; }
  .tile .info {
    position: absolute; inset: 0; background: var(--overlay); color: #fff;
    display: flex; flex-direction: column; justify-content: flex-end; text-align: left;
    padding: 10px; opacity: 0; transition: opacity .25s ease;
    font-size: 12px; line-height: 1.3;
  }
  .tile .rank {
    position: absolute; top: 6px; left: 8px;
    font-family: "Bebas Neue", Impact, sans-serif; font-size: 30px; line-height: 1;
  }
  .tile .album { font-weight: 600; font-size: 13px; }
  .tile .meta { color: #cfcfcf; margin-top: 2px; }
  .tile:hover img, .tile:focus-visible img { transform: scale(1.05); filter: blur(1px); }
  .tile:hover .info, .tile:focus-visible .info { opacity: 1; }
  .show-ranks .tile .badge { display: block; }
  .badge {
    display: none; position: absolute; top: 0; left: 0; background: var(--ink); color: var(--bg);
    font: 600 11px Inter, sans-serif; padding: 3px 6px;
  }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px;
    z-index: 10; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: min(80vw, 640px); max-height: 70vh; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .lightbox .cap { color: #fff; text-align: center; }
  .lightbox .cap .n { font-family: "Bebas Neue", Impact, sans-serif; font-size: 40px; line-height: 1; }
  .lightbox .cap .t { font-weight: 600; font-size: 18px; margin-top: 4px; }
  .lightbox .cap .m { color: #bbb; font-size: 14px; margin-top: 4px; }
  .lightbox .nav {
    position: absolute; top: 50%; transform: translateY(-50%); background: none; border: 0;
    color: #fff; font-size: 44px; cursor: pointer; padding: 12px; opacity: .7;
  }
  .lightbox .nav:hover { opacity: 1; }
  .lightbox .prev { left: 8px; } .lightbox .next { right: 8px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 16px 32px; }
</style>
</head>

const grid = document.getElementById("grid");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

grid.innerHTML = ALBUMS.map((a, i) => `
  <button class="tile" data-i="${i}" aria-label="${a.n}. ${esc(a.artist)} – ${esc(a.album)}">
    <img src="${encodeURI(a.img)}" alt="" loading="lazy">
    <span class="badge">${a.n}</span>
    <span class="info">
      <span class="rank">${a.n}</span>
      <span class="album">${esc(a.album)}</span>
      <span class="meta">${esc(a.artist)}</span>
      <span class="meta">${esc(a.label)} · ${esc(a.year)}</span>
    </span>
  </button>`).join("");

// Letterbox very wide/tall covers instead of cropping them
grid.querySelectorAll(".tile img").forEach(img => {
  const check = () => { const r = img.naturalWidth / img.naturalHeight; if (r > 1.25 || r < 0.8) img.parentElement.classList.add("wide"); };
  img.complete ? check() : img.addEventListener("load", check);
});

// Lightbox
const lb = document.getElementById("lb");
let cur = 0;
function show(i) {
  cur = (i + ALBUMS.length) % ALBUMS.length;
  const a = ALBUMS[cur];
  lb.querySelector("img").src = encodeURI(a.img);
  lb.querySelector("img").alt = `${a.artist} – ${a.album}`;
  lb.querySelector(".n").textContent = "#" + a.n;
  lb.querySelector(".t").textContent = a.album;
  lb.querySelector(".m").textContent = `${a.artist} · ${a.label} · ${a.year}`;
  lb.classList.add("open");
}
grid.addEventListener("click", e => { const t = e.target.closest(".tile"); if (t) show(+t.dataset.i); });
lb.addEventListener("click", e => {
  if (e.target.closest(".prev")) return show(cur - 1);
  if (e.target.closest(".next")) return show(cur + 1);
  lb.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") lb.classList.remove("open");
  if (e.key === "ArrowLeft") show(cur - 1);
  if (e.key === "ArrowRight") show(cur + 1);
});
</script>
